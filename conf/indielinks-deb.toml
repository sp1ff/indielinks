assets = "/usr/share/indielinks/assets"
collection-page-size = 64
log-file = "/var/log/indielinks/indielinks.log"
private-address = "127.0.0.1:20677"
public-address = "0.0.0.0:20676"
raft-grpc-address = "127.0.0.1:20678"
user-agent = "indielinks/0.0.1; +sp1ff@pobox.com"
version = "1"

[otlp-export]
endpoint = "http://localhost:9090/api/v1/otlp/v1/metrics"

[public-origin]
scheme = "http"
port = 20676

[public-origin.host]
RegName = "indielinks.local"

[storage-config.Scylla]
hosts = ["127.0.0.1:9042"]

PEPPER

[signing-keys]
"token-lifetime" = [300, 0] # seconds, nanoseconds => 5 min
"refresh-token-lifetime" = [259200, 0] # seconds, nanoseconds => 72 hours

SIGNINGKEYS

[users-config]
same-site = "Lax"
secure-cookies = true
[[users-config.allowed-origins]]     # http://localhost:18080
scheme = "http"
port = 18080
[users-config.allowed-origins.host]
RegName = "localhost"
[[users-config.allowed-origins]]     # http://127.0.0.1:18080
scheme = "http"
port = 18080
[users-config.allowed-origins.host]
Ipv4Address = "127.0.0.1"
[[users-config.allowed-origins]]     # http://localhost:20676
scheme = "http"
port = 20676
[users-config.allowed-origins.host]
RegName = "localhost"
[[users-config.allowed-origins]]     # http://127.0.0.1:20676
scheme = "http"
port = 20676
[users-config.allowed-origins.host]
Ipv4Address = "127.0.0.1"
[[users-config.allowed-origins]]     # http://localhost:18443
scheme = "http"
port = 18443
[users-config.allowed-origins.host]
RegName = "localhost"
[[users-config.allowed-origins]]     # http://127.0.0.1:18443
scheme = "http"
port = 18443
[users-config.allowed-origins.host]
Ipv4Address = "127.0.0.1"

[background-tasks]
default-timeout = { secs = 5, nanos = 0 }
max-concurrent-tasks = 16
sleep-duration = { secs = 1, nanos = 0 }
shutdown-timeout = { secs = 0, nanos = 500000000 } # "500ms"
pickup-timeout = { secs = 1, nanos = 0 }

[raft-config]
cluster-name = "indielinks"
this-node = 0
heartbeat-interval   = { secs = 0, nanos =  500000000 } # 500ms
election-timeout-min = { secs = 0, nanos = 1500000000 } # 1500ms
election-timeout-max = { secs = 0, nanos = 3000000000 } # 3000ms
snapshot-policy = { LogsSinceLast = 5000 }


[client-exponential-backoff]
jitter = 10.0
num-attempts = 3

[client-exponential-backoff.durations.min]
secs = 1
nanos = 0
[client-exponential-backoff.durations.max]
secs = 3
nanos = 0

[client-configuration]
timeout = [
    5,
    0,
]

[client-configuration.rate-limits]
custom = []
per-hour = 5760

[local-client-configuration]
timeout = [
    2,
    0,
]

[local-client-configuration.rate-limits]
custom = []
per-hour = 8320

[general-purpose-client-configuration]
timeout = [
    3,
    0,
]

[general-purpose-client-configuration.rate-limits]
custom = []
per-hour = 2880
