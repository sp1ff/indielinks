[package]
name = "indielinks-shared"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
async-trait = { workspace = true }
atom_syndication = { workspace = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
bytes = { workspace = true } # RUSTSEC-2026-0007
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
either = { workspace = true, features = [ "serde" ] }
email_address = "0.2.9"
# `getrandom` is really a transitive dependency, but we need the "js"
# feature for indielinks-fe builds (indielinks-fe depends on this
# crate). This is required despite what `cargo outdated` may say.
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = { workspace = true }
http = { workspace = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
nonempty-collections = { workspace = true, features = ["serde"] }
opentelemetry = { workspace = true }
pct-str = { workspace = true }
picky = { workspace = true }
pin-project = { workspace = true }
pkcs8 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
rsa = { workspace = true }
scylla = { workspace = true, features = ["full-serialization"], optional = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
snafu = { workspace = true, features = ["backtrace"] }
tap = { workspace = true }
time = { workspace = true } # RUSTSEC-2026-0009
tower = { workspace = true, features = ["retry"] }
tower-http = { workspace = true, features = ["cors"] }
typenum = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = []

__internal = []
backend = [
    "dep:aws-config",
    "dep:aws-sdk-dynamodb",
    "dep:scylla",
    "__internal"
]
