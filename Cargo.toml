hex = "0.4.3"
hkdf = "0.13"
hmac = "0.13"
http = "1.3.1"
indielinks = { path = "indielinks" }
indielinks-cache = { path = "indielinks-cache" }
indielinks-shared = { path = "indielinks-shared" }
inventory = "0.3.24"
itertools = "0.15.0"
