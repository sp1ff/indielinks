aws-sdk-dynamodb = "1.112.0"
aws-sdk-ssm = "1.110.0"
aws-smithy-async = "1.2.14"
aws-smithy-runtime-api = "1.12.1"
axum = "0.8.4"
axum-accept = "0.0.7"
axum-extra = "0.12.6"
base64 = "0.23.1"
bpaf = "0.9.20"
bytes = ">=1.11.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = "4.5.23"
comrak = "0.55.0"
crypto-common = "0.2.2"
dashmap = "6.1.0"
either = "1.15.0"
email_address = "0.2.9"
