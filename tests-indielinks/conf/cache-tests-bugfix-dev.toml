[domain]
alternator-config-base = "../target/conf/bugfix/indielinksd-alternator-"
haproxy-id = "bugfix"
haproxy-port = 20675
indielinks = "http://indiemark.local:20675"
local-state-base = "/tmp/indielinksd-bugfix-"
ops = "http://localhost:20710"
scylla-config-base = "../target/conf/bugfix/indielinksd-scylla-"
scylla-env-file = "bugfix.env"

[domain.dynamo]
location = [
    "http://127.0.0.1:8049",
    "http://127.0.0.1:8050",
    "http://127.0.0.1:8051",
]

[domain.raft-nodes.0]
addr = "127.0.0.1:20711"

[domain.raft-nodes.1]
addr = "127.0.0.1:20714"

[domain.raft-nodes.2]
addr = "127.0.0.1:20717"

[domain.raft-nodes.3]
addr = "127.0.0.1:20720"

[domain.raft-nodes.4]
addr = "127.0.0.1:20723"

[domain.scylla]
hosts = ["127.0.0.1:9049"]
translations = [
    [
    "172.13.0.2:9049",
    "127.0.0.1:9049",
],
    [
    "172.13.0.3:9049",
    "127.0.0.1:9050",
],
    [
    "172.13.0.4:9049",
    "127.0.0.1:9051",
],
]

[runner]
enforce-single-threaded = true
log-level = "DEBUG"
logging = true
no-setup = false
no-teardown = true
