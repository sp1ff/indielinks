[package]
name = "indielinks"
version = "0.0.1"
edition = "2021"
license-file = "../COPYING"
description = "Social bookmarking in the Fediverse"

[dependencies]
ammonia = "4.1.2"
argon2 = { version = "0.6.0" }
askama = { version = "0.16", features = ["code-in-doc"] }
async-stream = "0.3.6"
async-trait = { workspace = true }
atom_syndication = { workspace = true, features = ["with-serde"] }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-dynamodb = { workspace = true }
aws-sdk-ssm = "1.110.0"
aws-smithy-async = { version = "1.2.14", features = ["rt-tokio"] }
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
axum = { workspace = true, features = ["macros", "tracing"] }
axum-accept = "0.0.7"
axum-extra = { version = "0.12.6", features = ["cookie", "query", "typed-header"] }
base64 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = "0.11.0"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["cargo", "env"] }
comrak = "0.56.0"
crypto-common = { workspace = true }
dashmap = "6.1.0"
either = { workspace = true, features = ["serde"] }
enum-map = "3.1.0"
errno = "0.3.10"
form_urlencoded = "1.2.2"
futures = { workspace = true }
governor = { workspace = true }
hex = { workspace = true }
hkdf = "0.13"
hmac = "0.13"
http = { workspace = true }
indielinks-cache = { workspace = true }
indielinks-shared = { workspace = true, features = ["backend", "__internal"] }
inventory = { workspace = true }
itertools = { workspace = true }
jwt = { git = "https://github.com/mikkyang/rust-jwt.git", rev = "refs/pull/105/head" } # was 0.16.0
keyed_priority_queue = "0.4.2"
lazy_static = { workspace = true }
libc = { workspace = true }
lru = { workspace = true }
nonempty-collections = { workspace = true, features = ["serde"] }
nonzero = { workspace = true }
# We can't upgrade to 0.5+ until scylla does...
num-bigint = { version = "~0.4", features = ["serde"] }
openraft = { workspace = true, features = ["serde", "storage-v2"] }
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-prometheus-text-exporter = "0.4.0"
opentelemetry_sdk = "0.33.1"
ordered-float = { version = "5.3.0", features = ["libm", "serde"] }
password-hash = { version = "0.6.1", features = ["rand_core"] }
pct-str = { workspace = true }
phc = { version = "0.6.1", features = ["getrandom"] }
picky = { workspace = true }
pin-project = { workspace = true }
pkcs8 = { workspace = true }
prost = "0.14.4"
rand = { workspace = true, features = ["std_rng"] }
regex = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rmp-serde = { workspace = true }
rsa = { workspace = true }
scylla = { workspace = true, features = ["full-serialization"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { version = "0.11.15", features = ["alloc"] }
serde_dynamo = { workspace = true, features = ["aws-sdk-dynamodb+1"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tap = { workspace = true }
tempfile = "3.27.0"
time = { workspace = true } # RUSTSEC-2026-0009
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync"] }
toml = { workspace = true }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { workspace = true, features = ["retry"] }
tower-gcra = { workspace = true }
tower-http = { workspace = true, features = ["auth", "cors", "request-id", "set-header", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
unicode-segmentation = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
zxcvbn = "3.1.0"

[build-dependencies]
nickel-lang = { workspace = true }
prost-build = "0.14.4"
tonic-prost-build = "0.14.6"

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }
wiremock = { workspace = true }

[package.metadata.deb]
copyright = "Copyright (C) 2024-2026 Michael Herstine"
depends = ["libssl-dev", "adduser", "acl"]
conflicts = "indielinks-aws"
maintainer = "Michael Herstine <sp1ff@pobox.com>"
maintainer-scripts = "../admin/debian/deb-maintainer-scripts"
assets = [
       ["target/release/indielinksd", "/usr/bin/", "755"],
       ["target/release/indielinks-schemas", "/usr/bin/", "755"],
       ["target/release/indic", "/usr/bin/", "755"],
       ["target/release/indio", "/usr/bin/", "755"],
       ["../conf/indielinks-deb.toml", "/etc/indielinks.toml", "644"],
       ["../scripts/indielinks-post-install", "/usr/bin/indielinks-post-install", "755"],
       ["../scripts/indielinks-ctl", "/usr/bin/indielinks-ctl", "755"],
       ["../indielinks-fe/dist/index.html", "/usr/share/indielinks/assets/index.html", "644"],
       ["../indielinks-fe/dist/indielinks-fe.js", "/usr/share/indielinks/assets/indielinks-fe.js", "644"],
       ["../indielinks-fe/dist/style.css", "/usr/share/indielinks/assets/style.css", "644"],
       ["../indielinks-fe/dist/indielinks-fe.wasm", "/usr/share/indielinks/assets/indielinks-fe.wasm", "644"],

]
# indielinks requries a post-installation script to be run by the
# operator before it can startup. If using stystemd, enable the unit,
# but don't start it.
systemd-units = { unit-name="indielinks", enable=true, start=false }

[package.metadata.deb.variants.aws]
name = "indielinks-aws"
conflicts = "indielinks"
depends = ["debconf"]
maintainer-scripts = "../admin/debian/aws-deb-maintainer-scripts"
systemd-units = { enable = true, start = false }

assets = [
    ["target/release/indielinksd", "/usr/bin/", "755"],
    ["target/release/indielinks-schemas", "/usr/bin/", "755"],
    ["target/release/indic", "/usr/bin/", "755"],
    ["target/release/indio", "/usr/bin/", "755"],
    ["../target/conf/aws/indielinksd-aws.toml", "/etc/indielinks.toml", "644"],
    ["../scripts/indielinks-post-install", "/usr/bin/indielinks-post-install", "755"],
    ["../scripts/indielinks-ctl", "/usr/bin/indielinks-ctl", "755"],
    ["../indielinks-fe/dist-aws/index.html", "/usr/share/indielinks/assets/index.html", "644"],
    ["../indielinks-fe/dist-aws/indielinks-fe.js", "/usr/share/indielinks/assets/indielinks-fe.js", "644"],
    ["../indielinks-fe/dist-aws/style.css", "/usr/share/indielinks/assets/style.css", "644"],
    ["../indielinks-fe/dist-aws/indielinks-fe.wasm", "/usr/share/indielinks/assets/indielinks-fe.wasm", "644"],
    ["../admin/debian/aws-deb-maintainer-scripts/logrotate", "/etc/logrotate.d/indielinks", "644"],
]
